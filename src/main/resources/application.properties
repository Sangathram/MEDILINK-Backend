
spring.application.name=medilink

# Database: use environment variables when deployed
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/medilink}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Hosting platform provides the port
server.port=${PORT:8080}

# Security logging
logging.level.springframework.security=${SECURITY_LOG_LEVEL:INFO}

# Email configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.required=true
spring.mail.properties.mail.smtp.starttls.required=true

# File uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Browser origin: local development by default
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173}
